[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engine"
version = "0.1.0"
description = "StudyPilot AI Engine package"
readme = "Ai_Engine_README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.9",
]

[tool.setuptools]
packages = ["ai_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai_engine/tests"]

