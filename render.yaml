# =============================================================================
# Render Blueprint Specification for StudyPilot AI (Render Native Python)
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================
services:
  - type: web
    name: studypilot-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: CHROMA_PERSIST_DIRECTORY
        value: data/chroma_db
      - key: UPLOAD_DIR
        value: data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
