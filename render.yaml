# =============================================================================
# Render Blueprint Specification for StudyPilot AI (Render Native Python)
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================
services:
  - type: web
    name: studypilot-ai
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: studypilot-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/chroma_db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
